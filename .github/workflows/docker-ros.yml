name: docker-ros

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Architecture tags must not be overwritten by another run before assembly/cleanup.
concurrency:
  group: docker-ros-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-ros:
    strategy:
      matrix:
        target: [dev, run]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          enable-singlearch-push: true
          base-image: rwthika/ros2-cuda:jazzy-desktop-full
          enable-build-required-packages-only: "false"
          enable-recursive-vcs-import: "false"
          rmw-implementation: rmw_zenoh_cpp
          command: rviz2
          label-maintainer: Institute for Automotive Engineering (ika), RWTH Aachen University <opensource@ika.rwth-aachen.de>
          label-authors: Institute for Automotive Engineering (ika), RWTH Aachen University <opensource@ika.rwth-aachen.de>
        env:
          TARGET_CMAKE_ARGS: -DCMAKE_EXPORT_COMPILE_COMMANDS=1

  manifest:
    needs: docker-ros
    runs-on: ubuntu-latest
    steps:
      - name: Slugify ref name
        id: slugify-ref-name
        uses: gacts/github-slug@v1
        with:
          to-slug: ${{ github.head_ref || github.ref_name }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Push multi-arch manifests
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          # Match docker-ros's suffix for PRs and non-default branches.
          IMAGE_POSTFIX: ${{ github.ref_type != 'tag' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && format('_{0}_ci', steps.slugify-ref-name.outputs.slug) || '' }}
        run: |
          for suffix in '' '-dev' '-slim'; do
            image="${IMAGE_NAME,,}:${IMAGE_TAG}${suffix}${IMAGE_POSTFIX}"
            docker buildx imagetools create --tag "$image" "${image}-amd64" "${image}-arm64"
          done